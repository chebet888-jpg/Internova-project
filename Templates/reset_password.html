<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Internova</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <h2>Internova</h2>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('manage_students') }}">Manage Students</a>
            <a href="{{ url_for('manage_companies') }}">Manage Companies</a>
            <a href="{{ url_for('manage_internships') }}">Manage Internships</a>
            <a href="{{ url_for('manage_applications') }}">Applications</a>
            <a href="{{ url_for('reset_password') }}" class="active">Reset Password</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </aside>

     <main class="main-content reset-password-page"> 

        <h1>Reset Password</h1>
        <p>Update your administrator account password.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="success-message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <div class="form-container">

          <form method="POST" action="{{ url_for('reset_password') }}">

            <div class="form-group">
              <label for="current_password">Current Password</label>
              <input type="password" id="current_password"
                   name="current_password" required>
        </div>

        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password"
                   name="new_password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password"
                   name="confirm_password" required>
        </div>

        <div class="form-buttons">
            <button type="submit" class="primary-btn">
                Update Password
            </button>

            <a href="{{ url_for('dashboard') }}" class="cancel-btn">
                Cancel
            </a>
        </div>

    </form>

</div>
