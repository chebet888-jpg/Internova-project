<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Internship | Internova</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">
        <h2>Internova</h2>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('manage_students') }}">Manage Students</a>
            <a href="{{ url_for('manage_companies') }}">Manage Companies</a>
            <a href="{{ url_for('manage_internships') }}" class="active">Manage Internships</a>
            <a href="#">Applications</a>
            <a href="#">Reset Password</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </aside>

    <main class="main-content">

        <h1>Add New Internship</h1>
        <p>Post a new internship opportunity on Internova.</p>

        <div class="form-container">

            <form method="POST">

                <label>Internship Title</label>
                <input type="text" name="title"
                       placeholder="e.g. Software Developer Intern" required>

                <label>Company Name</label>
                <input type="text" name="company"
                       placeholder="Enter company name" required>

                <label>Location</label>
                <input type="text" name="location"
                       placeholder="e.g. Nairobi" required>

                <label>Application Deadline</label>
                <input type="date" name="deadline" required>

                <label>Internship Status</label>
                <select name="status" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <div class="form-buttons">

                    <button type="submit" class="primary-btn">
                        Save Internship
                    </button>

                    <a href="{{ url_for('manage_internships') }}" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
